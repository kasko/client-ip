version: 2.1

orbs:
  kasko-ci: kasko/ci-private@9

parameters:
  ai-review:
    type: boolean
    default: false
  pr-number:
    type: integer
    default: 0

jobs:
  test-using:
    parameters:
      php-version:
        type: string
    executor:
      name: kasko-ci/php-executor
      php-version: << parameters.php-version >>
    steps:
      - kasko-ci/php-version
      - checkout
      - restore_cache:
          keys:
            - v1-composer-cache-<< parameters.php-version >>-{{ checksum "composer.json" }}
            - v1-composer-cache-<< parameters.php-version >>
      - run:
          name: Validate composer files
          command: composer validate --strict
      - run:
          name: Lint PHP files
          command: |
            find src -name "*.php" -print0 | xargs -0 -n1 -P8 php -l
            find tests -name "*.php" -print0 | xargs -0 -n1 -P8 php -l
      - run:
          name: Install composer packages
          command: |
            composer update \
              --no-interaction \
              --no-progress \
              --prefer-dist \
              --prefer-stable
      - save_cache:
          key: v1-composer-cache-<< parameters.php-version >>-{{ checksum "composer.json" }}
          paths:
            - ./vendor
      - run:
          name: List installed packages
          command: composer show
      - run:
          name: Run PHP Code Sniffer
          command: composer cs
      - run:
          name: Run tests
          command: composer test
      - kasko-ci/php-security-check

  test:
    docker:
      - image: alpine
    steps:
      - run:
          name: Build done
          command: /bin/true

workflows:
  version: 2
  tests:
    when:
      not: << pipeline.parameters.ai-review >>
    jobs:
      - test-using:
          matrix:
            parameters:
              php-version:
                - php83
                - php84
                - php85
      - test:
          requires:
            - test-using-php83
            - test-using-php84
            - test-using-php85

  ai-review-workflow:
    when: << pipeline.parameters.ai-review >>
    jobs:
      - kasko-ci/claude-pr-review:
          name: ai-review
          gate: true
          pr-number: << pipeline.parameters.pr-number >>
